name: Unit test

on: 
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - run: python -m unittest tests -v
  windows:
    runs-on: windows-latest
    strps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - run: python -m unittest tests -v